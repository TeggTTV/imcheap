name: Build Unsigned iOS IPA

on:
    workflow_dispatch: # Lets you trigger builds manually from the GitHub Actions tab

jobs:
    build-unsigned-ipa:
        runs-on: macos-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: 'npm'

            - name: Install dependencies & sync Capacitor
              run: |
                  npm ci || npm install --legacy-peer-deps
                  npm run build
                  npx cap sync ios

            - name: Install CocoaPods (if Podfile exists)
              run: |
                  if [ -f "ios/App/Podfile" ]; then
                    cd ios/App && pod install
                  fi

            - name: Build unsigned .xcarchive
              run: |
                  if [ -f "ios/App/App.xcworkspace" ]; then
                    xcodebuild -workspace ios/App/App.xcworkspace \
                      -scheme App \
                      -configuration Release \
                      -sdk iphoneos \
                      -archivePath build/App.xcarchive \
                      archive \
                      CODE_SIGN_IDENTITY="" \
                      CODE_SIGNING_REQUIRED=NO \
                      CODE_SIGNING_ALLOWED=NO
                  else
                    xcodebuild -project ios/App/App.xcodeproj \
                      -scheme App \
                      -configuration Release \
                      -sdk iphoneos \
                      -archivePath build/App.xcarchive \
                      archive \
                      CODE_SIGN_IDENTITY="" \
                      CODE_SIGNING_REQUIRED=NO \
                      CODE_SIGNING_ALLOWED=NO
                  fi

            - name: Package into unsigned .ipa
              run: |
                  mkdir -p build/Payload
                  cp -r build/App.xcarchive/Products/Applications/*.app build/Payload/
                  cd build && zip -r App-unsigned.ipa Payload

            - name: Upload IPA artifact
              uses: actions/upload-artifact@v4
              with:
                  name: App-unsigned-ipa
                  path: build/App-unsigned.ipa
